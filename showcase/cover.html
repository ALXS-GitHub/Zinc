<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Zinc</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400..700&display=swap">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text); font-family: var(--font-sans); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .acc { fill: var(--accent); }
  .ink { fill: var(--text); }
  .tint { fill: var(--accent-soft); }
  .ground { fill: var(--bg); }
  .blk { rx: var(--radius-md); }
  .tile { rx: var(--radius-sm); }
  .tab { rx: var(--radius-xs); }
  .words { position: absolute; left: var(--space-6); bottom: var(--space-6); max-width: 440px; }
  .name { margin: 0; font-family: var(--font-display, var(--font-sans)); font-size: 120px; line-height: .9; font-weight: 600; letter-spacing: -.03em; color: var(--text); }
  .tag { margin: var(--space-3) 0 0 4px; font-size: 14px; line-height: 20px; color: var(--text-muted); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      accent 152×216 bled off the top (l'identité : une seule couleur d'accent) · text 168×224 bleeding off the right edge (l'encre, neutre-first) · accent-soft 120×144 (le fond d'un élément actif) — ≈30 % de 960×288
  arrangement une dalle accent haute + deux satellites, bas alignés à space-6 du bord, gouttières space-4
  pattern     tuiles du rang « geometric, modular, dense UI » : le README dit « l'entre-deux, ni rond ni carré » et des composants collés en groupe (tabs) — tuiles 24 px radius-sm à pas de space-8, certaines fusionnées sur deux comme un groupe de tabs (radius-xs), en accent sur la teinte, découpées en bg dans l'encre
  scales      côtés en multiples de space-2 ; gouttières space-4 ; pas space-8 ; coins radius-md (blocs), radius-sm (tuiles), radius-xs (tuiles fusionnées)
-->
<rect class="acc blk" x="24" y="-16" width="152" height="216" rx="8"/>
<rect class="tint blk" x="192" y="120" width="120" height="144" rx="8"/>
<rect class="ink blk" x="328" y="40" width="168" height="224" rx="8"/>

<rect class="acc tab" x="24" y="232" width="56" height="24" rx="3"/>
<rect class="acc tile" x="88" y="232" width="24" height="24" rx="6"/>
<rect class="acc tile" x="120" y="232" width="24" height="24" rx="6"/>
<rect class="acc tile" x="152" y="232" width="24" height="24" rx="6"/>

<rect class="acc tile" x="200" y="136" width="24" height="24" rx="6"/>
<rect class="acc tab" x="232" y="136" width="56" height="24" rx="3"/>
<rect class="acc tile" x="200" y="168" width="24" height="24" rx="6"/>
<rect class="acc tile" x="264" y="168" width="24" height="24" rx="6"/>
<rect class="acc tab" x="200" y="200" width="56" height="24" rx="3"/>
<rect class="acc tile" x="264" y="200" width="24" height="24" rx="6"/>
<rect class="acc tile" x="232" y="232" width="24" height="24" rx="6"/>
<rect class="acc tile" x="264" y="232" width="24" height="24" rx="6"/>

<rect class="ground tab" x="344" y="56" width="56" height="24" rx="3"/>
<rect class="ground tile" x="408" y="56" width="24" height="24" rx="6"/>
<rect class="ground tile" x="440" y="56" width="24" height="24" rx="6"/>
<rect class="ground tile" x="344" y="88" width="24" height="24" rx="6"/>
<rect class="ground tab" x="408" y="88" width="56" height="24" rx="3"/>
<rect class="ground tile" x="376" y="120" width="24" height="24" rx="6"/>
<rect class="ground tile" x="440" y="120" width="24" height="24" rx="6"/>
</svg>
</div>
<div class="words">
<h1 class="name">Zinc</h1>
<p class="tag">Une base sobre pour toutes les apps. Trois couches indépendantes.</p>
</div>
</div>
</body>
</html>
