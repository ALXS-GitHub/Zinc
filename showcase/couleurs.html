<!-- @dsCard group="Couleurs" height=900 width=1000 subtitle="Le thème de couleur, couche indépendante : trois graines (accent, neutre, mode) donnent tous les tokens, contrastes vérifiés en direct." -->
<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Couleurs — moteur de thème</title>
<style>
#ds { background: var(--bg); color: var(--text); padding: var(--space-4); display: flex; flex-direction: column; gap: var(--space-4); min-height: 100vh; box-sizing: border-box; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-4); align-items: start; }
.groups { display: flex; flex-direction: column; gap: var(--space-4); }
.grp h4 { margin: 0 0 var(--space-2); }
.sws { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: var(--space-2); }
.sw { border: 1px solid var(--border); border-radius: var(--radius-md); overflow: hidden; background: var(--surface); }
.sw .blk { height: 36px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: center; font-weight: 600; }
.sw .meta { padding: var(--space-1) var(--space-2); display: flex; flex-direction: column; font-size: var(--type-caption-size); line-height: var(--type-caption-line); }
.sw .nm { font-family: var(--font-mono); color: var(--text); }
.sw .hx { font-family: var(--font-mono); color: var(--text-muted); }
.sw .cr { color: var(--text-muted); }
.sw .cr.bad { color: var(--danger); font-weight: 600; }
.preview { position: sticky; top: 0; display: flex; flex-direction: column; gap: var(--space-3); }
.term { background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2) var(--space-3); font-family: var(--font-mono); font-size: var(--type-code-size); color: var(--text-muted); }
.term b { color: var(--accent-text); font-weight: 500; }
.link { color: var(--accent-text); text-decoration: underline; text-underline-offset: 2px; }
pre { margin: 0; max-height: 220px; overflow: auto; background: var(--surface-sunken); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: var(--space-2); font-family: var(--font-mono); font-size: 11px; line-height: 16px; color: var(--text); }
</style>
</head>
<body>
<div id="ds">
  <div class="zn-card" id="controls"></div>
  <div class="cols">
    <div class="groups" id="groups"></div>
    <div class="preview zn-panel" style="margin:0">
      <span class="zn-eyebrow" style="padding:0">Aperçu sur de vrais composants</span>
      <a class="zn-nav" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 20a2 2 0 0 0 2-2V8a2 2 0 0 0-2-2h-7.9a2 2 0 0 1-1.69-.9L9.6 3.9A2 2 0 0 0 7.93 3H4a2 2 0 0 0-2 2v13a2 2 0 0 0 2 2Z"/></svg> Projets</a>
      <div class="zn-card">
        <div class="zn-card-head"><span class="zn-card-title">Zorg</span><span class="zn-spacer"></span><span class="zn-chip zn-chip-progress">En cours</span></div>
        <span class="zn-card-desc">Tickets et kanbans pour tous les projets.</span>
        <span class="zn-field-help">Modifié il y a 2 h · <span class="link">ouvrir le dépôt</span></span>
      </div>
      <input class="zn-input" placeholder="Rechercher un ticket…" aria-label="Rechercher un ticket">
      <input class="zn-input is-focus" value="ZORG-26" aria-label="Référence">
      <div class="zn-row"><button class="zn-btn zn-btn-primary">Créer</button><button class="zn-btn zn-btn-secondary">Annuler</button><button class="zn-btn zn-btn-danger">Supprimer</button></div>
      <div class="zn-row"><span class="zn-chip zn-chip-open">Ouvert</span><span class="zn-chip zn-chip-done">Terminé</span><span class="zn-chip zn-chip-blocked">Bloqué</span></div>
      <div class="zn-row"><span class="zn-switch" data-state="checked"><span class="zn-switch-thumb"></span></span><span class="zn-checkbox" data-state="checked"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg></span></div>
      <div class="term"><b>$</b> bun run build</div>
      <button class="zn-btn zn-btn-secondary" id="showcss" style="align-self:flex-start">Voir le CSS du thème</button>
      <pre id="css" hidden></pre>
    </div>
  </div>
</div>
<script>
/*__ENGINE__*/
</script>
<script>
(function () {
  var Z = window.ZincTheme;
  var GROUPS = [
    { name: 'Surfaces', items: [['bg'], ['surface'], ['surface-subtle'], ['surface-muted'], ['surface-sunken']] },
    { name: 'Texte', items: [['text', Z.TEXT_GROUNDS, 4.5], ['text-muted', Z.TEXT_GROUNDS, 4.5], ['text-faint', Z.TEXT_GROUNDS, 4.5]] },
    { name: 'Bordures', items: [['border'], ['border-strong'], ['border-control', Z.TEXT_GROUNDS, 3]] },
    { name: 'Accent', items: [['accent'], ['accent-text', Z.TEXT_GROUNDS, 4.5], ['accent-soft'], ['on-accent', ['accent'], 4.5], ['focus-ring', Z.TEXT_GROUNDS, 3]] },
    { name: 'États', items: [['info', ['surface'], 3], ['success', ['surface'], 3], ['warning', ['surface'], 3], ['danger', ['surface'], 3]] }
  ];
  function mode() { return document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light'; }
  var state = { neutral: 'ardoise', accent: { preset: 'jaune' }, mode: mode() };
  var root = document.getElementById('ds');
  var controls = document.getElementById('controls');
  function fmt(x) { return x.toFixed(1).replace('.', ','); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

  function renderControls() {
    var preset = state.accent.preset || null;
    var custom = state.accent.color || '#f5c518';
    controls.innerHTML =
      '<div class="zn-theme-settings">' +
      '<div class="zn-theme-row"><span class="zn-field-label">Accent</span><div class="zn-swatches" role="radiogroup" aria-label="Accent">' +
      Z.ACCENT_PRESETS.map(function (p) { return '<button type="button" class="zn-swatch" role="radio" aria-checked="' + (preset === p.id) + '" aria-label="' + p.name + '" title="' + p.name + '" data-acc="' + p.id + '" style="--zn-swatch:' + p[state.mode] + '"></button>'; }).join('') +
      '<label class="zn-swatch-custom"' + (preset ? '' : ' data-checked') + '><input type="color" aria-label="Couleur libre" value="' + esc(custom) + '"><span>Couleur libre</span></label></div></div>' +
      '<div class="zn-theme-row"><span class="zn-field-label">Neutre</span><div class="zn-tabs-list" role="radiogroup" aria-label="Neutre">' +
      Z.NEUTRALS.map(function (n) { return '<button type="button" class="zn-tab" role="radio" aria-checked="' + (state.neutral === n.id) + '" data-state="' + (state.neutral === n.id ? 'on' : 'off') + '" data-neu="' + n.id + '">' + n.name + '</button>'; }).join('') +
      '</div></div>' +
      '<div class="zn-theme-row"><span class="zn-field-label">Mode</span><div class="zn-tabs-list" role="radiogroup" aria-label="Mode">' +
      [['light', 'Clair'], ['dark', 'Sombre']].map(function (m) { return '<button type="button" class="zn-tab" role="radio" aria-checked="' + (state.mode === m[0]) + '" data-state="' + (state.mode === m[0] ? 'on' : 'off') + '" data-mode="' + m[0] + '">' + m[1] + '</button>'; }).join('') +
      '</div></div></div>';
    controls.querySelector('input[type=color]').addEventListener('input', function (e) { state.accent = { color: e.target.value }; render(); });
  }

  controls.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.acc) state.accent = { preset: b.dataset.acc };
    if (b.dataset.neu) state.neutral = b.dataset.neu;
    if (b.dataset.mode) state.mode = b.dataset.mode;
    render();
  });

  function render() {
    var t = Z.buildTheme(state);
    Z.applyTheme(state, root);
    renderControls();
    document.getElementById('groups').innerHTML = GROUPS.map(function (g) {
      return '<div class="grp"><h4 class="zn-eyebrow" style="padding:0">' + g.name + '</h4><div class="sws">' + g.items.map(function (it) {
        var n = it[0], v = t[n], cr;
        if (it[1]) {
          var worst = Math.min.apply(null, it[1].map(function (gr) { return Z.contrast(v, t[gr]); }));
          var bad = worst < it[2];
          cr = '<span class="cr' + (bad ? ' bad' : '') + '">' + fmt(worst) + ':1 au pire sur ' + it[1].join(', ') + (bad ? ' — sous ' + fmt(it[2]) : '') + '</span>';
        } else if (n === 'accent-soft') {
          cr = '<span class="cr">text dessus : ' + fmt(Z.contrast(t.text, Z.blend(t.accent, t.surface, Z.alphaOf(v)))) + ':1</span>';
        } else { cr = '<span class="cr">fond</span>'; }
        var blk = n === 'on-accent' ? '<div class="blk" style="background:' + t.accent + ';color:' + v + '">Aa</div>' : '<div class="blk" style="background:' + v + '"></div>';
        return '<div class="sw">' + blk + '<div class="meta"><span class="nm">' + n + '</span><span class="hx">' + v + '</span>' + cr + '</div></div>';
      }).join('') + '</div></div>';
    }).join('');
    document.getElementById('css').textContent = Z.themeToCss(t, state.mode === 'dark' ? '[data-theme="dark"]' : ':root');
  }

  document.getElementById('showcss').addEventListener('click', function () {
    var p = document.getElementById('css'); p.hidden = !p.hidden;
    this.textContent = p.hidden ? 'Voir le CSS du thème' : 'Masquer le CSS';
  });
  new MutationObserver(function () { state.mode = mode(); render(); }).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  render();
})();
</script>
</body>
</html>
